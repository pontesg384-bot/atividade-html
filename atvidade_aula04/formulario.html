    <h1>Formulário de Cadastro</h1>

<form>

    <fieldset>

        <legend>Dados pessoais</legend>

        <label>Nome:</label>
        <input type="text">
        <br><br>

        <label>E-mail:</label>
        <input type="email">
        <br><br>

        <label>Idade:</label>
        <input type="number">
        <br><br>

    </fieldset> <h2>Curso</h2>

    <label>Selecione seu curso:</label>

    <select>
        <option>Ciência da Computação</option>
        <option>Sistemas de Informação</option>
        <option>Análise e Desenvolvimento de Sistemas</option>
        <option>Engenharia de Software</option>
        <option>Outro</option>
    </select>
    <h2>Turno</h2>

    <p>Qual período você estuda?</p>

    <input type="radio" name="turno" value="manha">
    <label>Manhã</label>

    <input type="radio" name="turno" value="tarde">
    <label>Tarde</label>

    <input type="radio" name="turno" value="noite">
    <label>Noite</label>
    <h2>Tecnologias</h2>

    <p>Quais tecnologias você deseja aprender?</p>

    <input type="checkbox">
    <label>HTML</label>

    <input type="checkbox">
    <label>CSS</label>

    <input type="checkbox">
    <label>JavaScript</label>

    <input type="checkbox">
    <label>Python</label>

    <input type="checkbox">
    <label>Java</label>
    <h2>Sobre você</h2>

    <label>Fale um pouco sobre você:</label>
    <br>

    <textarea rows="5" cols="40"></textarea>

    <br><br>

    <input type="submit" value="Enviar Cadastro">

</form>


</body>
